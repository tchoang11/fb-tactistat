# Models use "<provider>:<alias>" handles.
# `kind` selects the OpenAI-compatible or Gemini adapter.
# `json_mode`: schema = constrained, object = valid JSON, none = free text.
# Recheck support with `python scripts/probe_models.py`.

providers:

  groq:
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    signup_url: https://console.groq.com/keys
    free_tier: "~30 RPM, ~1k requests/day per model, no credit card"
    models:
      # Groq gpt-oss supports schema; Llama supports object mode.
      gpt-oss-120b:
        id: openai/gpt-oss-120b
        json_mode: schema
        verified: "2026-08-06, 728ms"
      gpt-oss-20b:
        id: openai/gpt-oss-20b
        json_mode: schema
        verified: "2026-08-06, 970ms"
      llama-3.1-8b:
        id: llama-3.1-8b-instant
        json_mode: object
        verified: "2026-08-06, 220ms"
      # llama-3.3-70b-versatile was decommissioned by Groq on 2026-08-16.
      # Its replacement here is gpt-oss-120b

  gemini:
    kind: gemini
    api_key_env: GEMINI_API_KEY
    signup_url: https://aistudio.google.com/apikey
    free_tier: "flash tier only; pro models answer 429 on a free key"
    # Gemini accepts an OpenAPI subset, not full JSON Schema.
    schema_dialect: openapi_subset
    # fixed_sampling: the model ignores temperature, so we do not send it.
    models:
      3.6-flash:
        id: gemini-3.6-flash
        json_mode: schema
        fixed_sampling: true
        verified: "2026-08-06, 2128ms"
      3.5-flash:
        id: gemini-3.5-flash
        json_mode: schema
        verified: "2026-08-06, 11997ms - accurate but slow, poor fit for a 50-question eval loop"
      3.5-flash-lite:
        id: gemini-3.5-flash-lite
        json_mode: schema
        fixed_sampling: true
        verified: "2026-08-06, 851ms"
      3.1-flash-lite:
        id: gemini-3.1-flash-lite
        json_mode: schema
        verified: "2026-08-06, 1111ms"
      # Skip moving aliases and models unavailable to the free key.

  cerebras:
    kind: openai_compat
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    signup_url: https://cloud.cerebras.ai
    free_tier: "~1M tokens/day, 30 RPM"
    models:
      llama-3.3-70b: { id: llama-3.3-70b, json_mode: object, verified: "not tested - no key" }
      gpt-oss-120b:  { id: gpt-oss-120b,  json_mode: schema, verified: "not tested - no key" }

  dashscope:
    kind: openai_compat
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    signup_url: https://modelstudio.console.alibabacloud.com
    free_tier: "per-model token grant with an expiry, not a renewing daily quota"
    extra_body: { enable_thinking: false }
    models:
      qwen-plus:  { id: qwen-plus,  json_mode: schema, verified: "2026-08-11, 1725ms" }
      qwen-turbo: { id: qwen-turbo, json_mode: schema, verified: "2026-08-11, 381ms" }
      qwen-flash: { id: qwen-flash, json_mode: schema, verified: "2026-08-11, 290ms" }
      qwen3-32b:  { id: qwen3-32b,  json_mode: schema, verified: "2026-08-11, 410ms" }
      # DashScope also serves DeepSeek; both accept strict schema.
      deepseek-v3.2:   { id: deepseek-v3.2,   json_mode: schema, verified: "2026-08-16, 596ms" }
      deepseek-v4-pro: { id: deepseek-v4-pro, json_mode: schema, verified: "2026-08-16, 1250ms" }
      # deepseek-v4-flash reformats 0.94 as 0,94, breaking number-fidelity checks.

  openrouter:
    kind: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    signup_url: https://openrouter.ai/keys
    free_tier: "20 RPM but only 50 requests/day until you top up $10 - too tight for a full eval run"
    models:
      deepseek-v3:   { id: "deepseek/deepseek-chat-v3-0324:free",        json_mode: object, verified: "not tested - no key" }
      llama-3.3-70b: { id: "meta-llama/llama-3.3-70b-instruct:free",     json_mode: object, verified: "not tested - no key" }

  github:
    kind: openai_compat
    base_url: https://models.github.ai/inference
    api_key_env: GITHUB_MODELS_TOKEN
    signup_url: https://github.com/settings/tokens
    free_tier: "low per-minute limits tied to your GitHub account tier"
    models:
      gpt-4o-mini:   { id: openai/gpt-4o-mini,            json_mode: schema, verified: "not tested - no key" }
      llama-3.3-70b: { id: meta/Llama-3.3-70B-Instruct,   json_mode: object, verified: "not tested - no key" }

  # Ollama reuses the OpenAI-compatible adapter without a real key.
  ollama:
    kind: openai_compat
    base_url: http://localhost:11434/v1
    api_key_env: null
    signup_url: https://ollama.com/download
    free_tier: "unlimited, runs on your machine, but ~10-20x slower than a hosted endpoint"
    models:
      qwen2.5-7b:  { id: "qwen2.5:7b",  json_mode: none, verified: "not tested - not installed" }
      llama3.1-8b: { id: "llama3.1:8b", json_mode: none, verified: "not tested - not installed" }

  openai:
    kind: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    signup_url: https://platform.openai.com/api-keys
    free_tier: "none - paid only"
    models:
      gpt-5-mini:  { id: gpt-5-mini,  json_mode: schema, verified: "not tested - no key" }
      gpt-4o-mini: { id: gpt-4o-mini, json_mode: schema, verified: "not tested - no key" }
