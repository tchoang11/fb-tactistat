# Baseline configuration; experiments override only changed values.

# --- Data scope ---------------------------------------------------------------
# One competition shared by stats and RAG data.
dataset:
  competition_id: 43
  season_id: 106
  competition_name: "FIFA World Cup"
  season_name: "2022"
  # Suppress noisy per-90 rates below this threshold.
  min_minutes_for_per90: 270

# --- Which model plays which role --------------------------------------------
# Handles resolve through models.yaml; judge uses another model family.
models:
  # Supports strict JSON schema for router labels.
  router: groq:gpt-oss-20b

  # Larger prose model for final answers.
  synthesis: groq:llama-3.3-70b

  # Separate family reduces judge self-preference.
  judge: gemini:3.6-flash

# Low-variance decoding and cached calls.
llm:
  temperature: 0.0
  max_tokens: 1024
  timeout_seconds: 60
  max_retries: 3
  # Reuse identical model calls across evaluations.
  cache_enabled: true
  cache_dir: data/cache/llm

# --- Router -------------------------------------------------------------------
router:
  # few_shot = LLM prompted with labelled examples (baseline)
  # keyword  = zero-LLM heuristic baseline, for the cost/latency ablation
  strategy: few_shot
  labels: [STAT, TACTICAL, HYBRID]

# --- Stats tool ---------------------------------------------------------------
stats_tool:
  processed_dir: data/processed
  # Metric names must exist in stats_tool/aggregate.py.
  metrics:
    - goals
    - assists
    - xg
    - shots
    - passes_attempted
    - passes_completed
    - pass_accuracy
    - key_passes
    - dribbles_completed
    - tackles
    - interceptions
  per90_metrics: [goals, assists, xg, shots, passes_completed, key_passes]

# --- Wikipedia corpus ---------------------------------------------------------
# Wikipedia scope is derived from the selected competition.
wikipedia:
  language: en
  # Wikimedia requires a descriptive User-Agent.
  user_agent: "TactiStat/0.1 (https://github.com/tchoang11/fb-tactistat) python-requests"

  # Keep regular players and every scorer.
  min_appearances: 4
  include_all_scorers: true

  # Shared rate limit and retry policy for the MediaWiki API.
  max_workers: 4
  requests_per_second: 5
  max_retries: 5
  timeout_seconds: 30
  # Let Wikimedia shed requests while replicas lag.
  maxlag_seconds: 5

  # Exclude navigational sections from retrieval.
  drop_sections:
    - References
    - External links
    - See also
    - Notes
    - Bibliography
    - Further reading
    - Sources
    - Citations
  # Drop sections too short to answer a question.
  min_section_chars: 120

# --- RAG tool -----------------------------------------------------------------
rag:
  corpus_dir: data/processed/wikipedia
  index_dir: data/index

  # Default to semantic Wikipedia section boundaries.
  # max_tokens is a hard budget measured with the embedding model's own
  # tokenizer, and it includes the title/heading prefix every chunk carries.
  # 11.5% of sections exceed bge-small's 512-token window, and a
  # sentence-transformer truncates silently rather than failing, so anything
  # over the budget would be embedded as a prefix and a fragment.
  chunking:
    strategy: section          # section | fixed
    max_tokens: 512            # sections longer than this get sub-split
    overlap_tokens: 0          # applied within a split section, never across two

  embedding:
    model: BAAI/bge-small-en-v1.5
    batch_size: 32
    normalize: true

  retrieval:
    mode: dense                # dense | bm25 | hybrid
    top_k: 5
    # Hybrid fuses ranks, not scores: a BM25 score is unbounded and
    # corpus-relative while a normalised cosine similarity lives in [-1, 1],
    # so a weighted sum of the two means something different for every query.
    # This is the dense retriever's weight in the reciprocal rank fusion.
    hybrid_alpha: 0.5

  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    # Retrieve this many candidates, rerank, keep retrieval.top_k.
    candidate_k: 20

# --- Synthesis ----------------------------------------------------------------
synthesis:
  # Refuse when tools return no usable evidence.
  allow_abstain: true
  require_citations: true

# --- Evaluation ---------------------------------------------------------------
eval:
  test_set: eval/test_set.json
  results_dir: eval/results
  recall_at_k: [1, 3, 5, 10]
  # Section 7: bootstrap resampling for player-comparison questions.
  bootstrap:
    n_resamples: 10000
    confidence_level: 0.95
    seed: 42
