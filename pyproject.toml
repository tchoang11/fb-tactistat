[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tactistat"
version = "0.1.0"
description = "Agentic RAG over football event data and Wikipedia, with a research-grade evaluation harness."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "tchoang11" }]

dependencies = [
    # --- Data ---------------------------------------------------------------
    "statsbombpy>=1.14",
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "pyarrow>=15",              # parquet writer for processed tables
    "requests>=2.32",           # Wikipedia REST API

    # --- Orchestration ------------------------------------------------------
    # LangChain tools/model adapters and the LangGraph pipeline.
    "langchain>=1.0",
    "langgraph>=1.0",
    # EnsembleRetriever, ContextualCompressionRetriever and CrossEncoderReranker
    # live in langchain-classic as of LangChain 1.0; BM25Retriever, the FAISS
    # store and HuggingFaceCrossEncoder are in langchain-community, which is
    # being sunset. Both are pinned rather than avoided: replacing them means
    # hand-rolling rank fusion and reranking, which is the work this project
    # deliberately does not spend its budget on.
    "langchain-classic>=1.0",
    "langchain-community>=0.4",
    # One adapter per provider `kind` in configs/models.yaml: ChatOpenAI serves
    # every openai_compat provider (Groq, DashScope, Cerebras, Ollama, ...).
    "langchain-openai>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-huggingface>=1.0",
    "langchain-text-splitters>=1.0",

    # --- Retrieval ----------------------------------------------------------
    "sentence-transformers>=3.0",
    "transformers>=4.44",       # tokenizer used to budget chunks in tokens
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",

    # --- LLM providers ------------------------------------------------------
    # Raw clients are also used by scripts/probe_models.py.
    "openai>=1.50",
    "google-genai>=1.0",        # Gemini speaks its own wire format

    # --- Stats / plotting ---------------------------------------------------
    "scipy>=1.13",              # bootstrap CI (Section 7)
    "matplotlib>=3.8",          # ablation charts

    # --- Plumbing -----------------------------------------------------------
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
tactistat = "tactistat.cli:main"

[project.urls]
Repository = "https://github.com/tchoang11/fb-tactistat"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a built index and downloaded Hugging Face models",
]
